<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kutilang Sky Courier — a bush-plane flight game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c23b2e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23f2e3c6'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d4e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kutilang Sky Courier: fly the bush plane through golden rings, land on island airstrips, and deliver parcels through storm gusts"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
<!--
  Kutilang Sky Courier — a bush-plane flight game over a golden-hour
  island archipelago. Keyboard + mouse, zero network requests, all
  sounds synthesized. Missions: Ring Run, Island Hop, Storm Courier.
  Serve locally with `node serve.ts`, then open http://localhost:8080.
  Screenshots: open ?shot=start|play|ring|land in desktop Chrome.
-->
